[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# PyPI distribution name is "eval-integrity" ("evalgate" and look-alikes were taken/blocked); the import package + CLI
# stay `evalgate` / `evalgate-mcp` (distribution name != import name is standard, cf. scikit-learn).
[project]
name = "eval-integrity"
version = "0.6.0"
description = "Dependency-free statistical checks for AI eval claims (multiple-comparisons, judge-bias, resolution, fragility) — as a CLI and an MCP server an agent calls before trusting a benchmark number."
readme = "README.md"
requires-python = ">=3.10"   # the [mcp] extra pulls mcp>=1.2, which requires 3.10+;
                             # a wider floor makes `uv sync` unsatisfiable on 3.9. Python 3.9 is EOL.
license = { text = "MIT" }
authors = [{ name = "Ilpo Vaatainen" }]
keywords = [
    "llm", "evaluation", "benchmark", "judge-bias", "statistics",
    "multiple-comparisons", "mlops", "reproducibility", "eval",
    "mcp", "model-context-protocol", "agent", "agent-tools", "ai-agents",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
# `mcp` is a hard dependency, not an extra. It was an extra for a while, on the reasoning
# that the statistical checks are zero-dependency and only the MCP server needs it. That
# reasoning was right about the code and wrong about the world: every installer that did
# not spell out the extra — a registry entry, a container build, a user typing the obvious
# command — produced a package whose server dies at import. An extra that is required for
# the advertised entry point to run is not optional.
dependencies = ["mcp>=1.2,<2"]   # 2.0 removed mcp.server.fastmcp, which mcp_server.py imports

# Kept as an empty alias so existing `pip install "eval-integrity[mcp]"` keeps working.
[project.optional-dependencies]
mcp = []

[project.urls]
Homepage = "https://ipezygj.github.io/eval-audit-site/"
Book = "https://leanpub.com/measurednotbelieved"
Source = "https://github.com/ipezygj/evalgate"

[project.scripts]
evalgate = "evalgate.cli:main"
evalgate-mcp = "evalgate.mcp_server:main"

[tool.setuptools]
packages = ["evalgate"]
